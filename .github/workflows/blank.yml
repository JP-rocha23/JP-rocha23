name: Generate Language Pie Chart

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  # Permite rodar manualmente a qualquer momento
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Language Graph
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_LOC_CHART: "true"
          SHOW_PROFILE_VIEWS: "false"
          SHOW_SHORT_INFO: "false"
          SHOW_COMMIT: "false"
          SHOW_DAYS_OF_WEEK: "false"
          SHOW_LANGUAGE: "true"
          SHOW_LANGUAGE_PER_REPO: "false"
          SHOW_PROJECTS: "false"
          SHOW_TIME: "false"
          LOC_CHART_TYPE: "pie"
          SHOW_TITLE: "false"
          LOC_CHARTS_COLOR: "deep_ocean"
          HIDE_LOC_EXTENSIONS: "html,css,jupyter notebook,markdown,gitignore"
          GENERATED_IMAGE_NAME: "generated/languages"

      - name: Commit & Push changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: "main"
          force: true
          message: "Update language pie chart [skip ci]"
